name: Build watch face

on:
  push:
    paths:
      - "WatchFace/**"
      - "Rampart/**"
      - ".github/workflows/watchface.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: WatchFace
            artifact: tidal-watch-face
          - dir: Rampart
            artifact: rampart-watch-face
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Check generated XML is up to date
        run: |
          python3 tools/generate.py
          git diff --exit-code -- app/src/main/res

      - name: Validate against the Watch Face Format schema
        run: |
          pip install xmlschema
          git clone --depth 1 https://github.com/google/watchface.git /tmp/wff
          python3 tools/validate.py /tmp/wff/third_party/wff/specification/documents/2/watchface.xsd

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.WATCHFACE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::WATCHFACE_KEYSTORE_B64 secret not set - signing with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/watchfaces.p12"
          echo "WATCHFACE_KEYSTORE=$RUNNER_TEMP/watchfaces.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          WATCHFACE_KEYSTORE_PASSWORD: ${{ secrets.WATCHFACE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Show signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -i 'SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/app/build/outputs/apk/release/*.apk
